<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A deliberately buggy single-player Pong game for a GitHub Copilot testing lab." />
    <title>Copilot Pong Testing Lab</title>
  </head>
  <body>
    <main class="shell">
      <header class="scoreboard" aria-label="Scoreboard">
        <div>Score: <strong data-testid="score">0</strong></div>
        <h1>Ping</h1>
        <div>Best: <strong data-testid="best-score">0</strong></div>
      </header>
      <section class="game-wrap" aria-label="Pong game">
        <canvas id="game" width="800" height="600" aria-label="Single-player Pong play field"></canvas>
        <p class="status" data-testid="status">Running</p>
      </section>
      <section class="controls" aria-label="Game controls">
        <button type="button" data-action="pause">Pause</button>
        <button type="button" data-action="reset">Reset run</button>
      </section>
      <p class="instructions">Move with <kbd>←</kbd>/<kbd>→</kbd> or <kbd>A</kbd>/<kbd>D</kbd>. Pause with <kbd>Space</kbd>.</p>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
